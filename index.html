  #hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    background: rgba(0,0,0,0.60);
    z-index: 10;
    border-bottom: 3px solid #f9a825;
  }
  .hud-item {
    color: #FFE082;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.52rem;
    text-shadow: 2px 2px 0 #3e2723;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    line-height: 1.8;
  }
  .hud-label { color: #a5d6a7; font-size: 0.42rem; }

  /* Player canvas */
  #player {
    position: absolute;
    bottom: 52px;
    width: 130px;
    height: 162px;
    z-index: 5;
    image-rendering: pixelated;
  }

  /* Falling items are canvases */
  .falling-item {
    position: absolute;
    width: 52px;
    height: 52px;
    z-index: 4;
    image-rendering: pixelated;
    pointer-events: none;
  }

  .score-popup {
    position: absolute;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.75rem;
    pointer-events: none;
    z-index: 20;
    animation: floatUp 0.9s ease-out forwards;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.9);
  }
  @keyframes floatUp {
    0%   { opacity:1; transform:translateY(0) scale(1.2); }
    100% { opacity:0; transform:translateY(-70px) scale(0.8); }
  }

  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.75);
    z-index: 30;
    gap: 14px;
    padding: 24px 20px;
    text-align: center;
  }
  .screen h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: 1.0rem;
    color: #FFE082;
    text-shadow: 3px 3px 0 #5d4037;
    line-height: 1.8;
  }
  .screen p {
    color: #e0e0e0;
    font-family: 'Nunito', sans-serif;
    font-size: 0.92rem;
    max-width: 340px;
    line-height: 1.5;
  }
  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.72rem;
    padding: 13px 26px;
    background: linear-gradient(180deg, #f9a825, #e65100);
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 5px 0 #bf360c, 0 7px 16px rgba(0,0,0,0.4);
    transition: transform 0.08s, box-shadow 0.08s;
    letter-spacing: 1px;
  }
  .btn:hover { transform:translateY(-2px); }
  .btn:active { transform:translateY(4px); box-shadow:0 1px 0 #bf360c; }

  .legend {
    display: flex;
    gap: 20px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 4px;
    padding: 10px 18px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 0.88rem;
    font-weight: 700;
  }
  .legend-canvas {
    image-rendering: pixelated;
  }

  #level-banner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    font-family: 'Press Start 2P', monospace;
    font-size: 0.88rem;
    color: #FFE082;
    text-shadow: 2px 2px 0 #e65100;
    background: rgba(0,0,0,0.75);
    padding: 14px 28px;
    border-radius: 4px;
    border: 2px solid #f9a825;
    z-index: 25;
    display: none;
    animation: popIn 0.4s ease-out;
    text-align: center;
    line-height: 2;
  }
  @keyframes popIn {
    0%   { transform:translate(-50%,-50%) scale(0.4); opacity:0; }
    80%  { transform:translate(-50%,-50%) scale(1.08); }
    100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
  }

  #touch-controls {
    display: none;
    position: absolute;
    bottom: 60px;
    left: 0; right: 0;
    justify-content: space-between;
    padding: 0 14px;
    z-index: 10;
    pointer-events: none;
  }
  .touch-btn {
    width: 86px; height: 70px;
    background: rgba(255,255,255,0.20);
    border-radius: 8px;
    font-size: 2rem;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid rgba(255,255,255,0.34);
    cursor: pointer;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
    color: #fff;
    pointer-events: auto;
  }

  @media (max-width: 768px), (pointer: coarse) {
    body { padding: 0; }
    #game-container { border-radius: 0; box-shadow: none; }
    #touch-controls { display:flex; }
    .screen { padding: 26px 26px 92px; }
    .btn { min-height: 46px; }
  }

  @media (max-height: 560px) and (orientation: landscape) {
    .screen { gap: 8px; padding: 12px 22px 80px; }
    .screen h1 { font-size: 0.78rem; line-height: 1.55; }
    .screen p { font-size: 0.78rem; line-height: 1.35; }
    .legend { padding: 6px 12px; gap: 12px; }
    #touch-controls { bottom: 34px; }
  }
</style>
</head>
<body>
<div id="game-container">
  <div id="bg-layer"></div>

  <div id="hud">
    <div class="hud-item"><span class="hud-label">PONTOS</span><span id="score-display">0</span></div>
    <div class="hud-item"><span class="hud-label">FASE</span><span id="level-display">1</span></div>
    <div class="hud-item"><span class="hud-label">VIDAS</span><span id="lives-display">♥ ♥ ♥</span></div>
  </div>

  <!-- Player rendered as canvas (black bg removed) -->
  <canvas id="player" width="130" height="162"></canvas>

  <div id="touch-controls">
    <div class="touch-btn" id="btn-left">◀</div>
    <div class="touch-btn" id="btn-right">▶</div>
  </div>

  <div id="level-banner">🌾 FASE <span id="banner-level">1</span>!<br><span style="font-size:0.6rem;color:#a5d6a7">Ficou mais difícil!</span></div>

  <!-- Start Screen -->
  <div class="screen" id="start-screen">
    <h1>☕ PEGA CAFÉ<br>DO LUCAS! ☕</h1>
    <div class="legend">
      <div class="legend-item">
        <canvas class="legend-canvas" id="legend-grao" width="40" height="40"></canvas>
        Grão = <b>+10 pts</b>
      </div>
      <div class="legend-item">
        <canvas class="legend-canvas" id="legend-minha" width="40" height="40"></canvas>
        Minhoca = <b style="color:#ef9a9a">−20 pts</b>
      </div>
    </div>
    <p>Use <b>← →</b> para mover o cestinho.<br>Pegue os grãos e <b>evite as minhocas!</b><br>Se um grão cair no chão, perde uma vida ❤️</p>
    <button class="btn" id="start-btn">▶ JOGAR!</button>
  </div>

  <!-- Game Over Screen -->
  <div class="screen" id="gameover-screen" style="display:none;">
    <h1>FIM DE<br>COLHEITA!</h1>
    <p id="final-score-msg" style="font-size:1rem;font-family:'Press Start 2P',monospace;color:#FFE082;line-height:2;"></p>
    <p id="final-level-msg" style="color:#a5d6a7;font-family:'Nunito',sans-serif;"></p>
    <button class="btn" id="restart-btn">↺ DE NOVO!</button>
  </div>
</div>

<script>
// ─── Remove black background from image, draw to canvas ───────────────────
function removeBlackBg(imgSrc, canvas, threshold) {
  threshold = threshold || 30;
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const w = canvas.width, h = canvas.height;
      const ctx = canvas.getContext('2d');
      // draw scaled
      const offscreen = document.createElement('canvas');
      offscreen.width = img.naturalWidth;
      offscreen.height = img.naturalHeight;
      const oct = offscreen.getContext('2d');
      oct.drawImage(img, 0, 0);
      const data = oct.getImageData(0, 0, offscreen.width, offscreen.height);
      const px = data.data;
      for (let i=0; i<px.length; i+=4) {
        const r=px[i], g=px[i+1], b=px[i+2];
        if (r < threshold && g < threshold && b < threshold) {
          px[i+3] = 0; // transparent
        }
      }
      oct.putImageData(data, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.drawImage(offscreen, 0, 0, w, h);
      resolve(canvas);
    };
    img.src = imgSrc;

// Cached off-screen canvases for sprites
let cachedGrao = null;
let cachedMnh  = null;

// ─── GAME STATE ────────────────────────────────────────────────────────────
const GAME_W = 480;
const FALL_LEFT = 30, FALL_W = 420;

let score=0, lives=3, level=1;
let gameRunning=false, animId=null, lastTime=0, spawnTimer=0;
let fallingItems=[];
let playerX = GAME_W/2 - 65;
let keys = {left:false, right:false};

function getLevelConfig(lv) {
  return {
    spawnInterval: Math.max(480, 1700 - lv*105),
    fallSpeed:     Math.min(5.2, 1.6 + lv*0.28),
    wormChance:    Math.min(0.44, 0.08 + lv*0.028),
    playerSpeed:   Math.min(7.5, 4.5 + lv*0.2),
  };
}

const playerCanvas = document.getElementById('player');
const scoreEl  = document.getElementById('score-display');
const levelEl  = document.getElementById('level-display');
const livesEl  = document.getElementById('lives-display');
const startScr = document.getElementById('start-screen');
const overScr  = document.getElementById('gameover-screen');
const container= document.getElementById('game-container');
let currentScale = 1;

function fitGameToScreen() {
  const safeW = window.innerWidth;
  const safeH = window.innerHeight;
  currentScale = Math.min(safeW / GAME_W, safeH / 640, 1);
  document.body.style.setProperty('--game-scale', currentScale.toFixed(4));
}
fitGameToScreen();
window.addEventListener('resize', fitGameToScreen);
window.addEventListener('orientationchange', () => setTimeout(fitGameToScreen, 120));

const banner   = document.getElementById('level-banner');
const bannerLv = document.getElementById('banner-level');

// ─── INPUT ─────────────────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key==='ArrowLeft'  || e.key==='a') keys.left=true;
  if (e.key==='ArrowRight' || e.key==='d') keys.right=true;
});
document.addEventListener('keyup', e => {
  if (e.key==='ArrowLeft'  || e.key==='a') keys.left=false;
  if (e.key==='ArrowRight' || e.key==='d') keys.right=false;
});
document.getElementById('btn-left').addEventListener('touchstart',  e=>{e.preventDefault();keys.left=true;},{passive:false});
document.getElementById('btn-left').addEventListener('touchend',    e=>{e.preventDefault();keys.left=false;},{passive:false});
document.getElementById('btn-left').addEventListener('touchcancel', e=>{e.preventDefault();keys.left=false;},{passive:false});
document.getElementById('btn-right').addEventListener('touchstart', e=>{e.preventDefault();keys.right=true;},{passive:false});
document.getElementById('btn-right').addEventListener('touchend',   e=>{e.preventDefault();keys.right=false;},{passive:false});
document.getElementById('btn-right').addEventListener('touchcancel',e=>{e.preventDefault();keys.right=false;},{passive:false});

let dragging=false, dragStartX=0, dragPX=0;
container.addEventListener('mousedown', e=>{ dragging=true; dragStartX=e.clientX; dragPX=playerX; });
document.addEventListener('mouseup',   ()=>dragging=false);
document.addEventListener('mousemove', e=>{
  if(!dragging||!gameRunning) return;
  playerX=Math.max(0,Math.min(GAME_W-130, dragPX+(e.clientX-dragStartX)/currentScale));
});
let tX=0, tPX=0;
container.addEventListener('touchstart', e=>{e.preventDefault(); tX=e.touches[0].clientX; tPX=playerX;},{passive:false});
container.addEventListener('touchmove',  e=>{
  if(!gameRunning) return;
  playerX=Math.max(0,Math.min(GAME_W-130, tPX+(e.touches[0].clientX-tX)/currentScale));
  e.preventDefault();
},{passive:false});

// ─── HUD ───────────────────────────────────────────────────────────────────
function updateHUD() {
  scoreEl.textContent = score;
  levelEl.textContent = level;
  livesEl.textContent = lives>0 ? '♥ '.repeat(lives).trim() : '✕';
  livesEl.style.color = lives<=1 ? '#ef5350' : '#FFE082';
}

// ─── SPAWN ─────────────────────────────────────────────────────────────────
function makeItemCanvas(src, cached) {
  const cvs = document.createElement('canvas');
  cvs.width=52; cvs.height=52;
  cvs.className='falling-item';
  if (cached) {
    cvs.getContext('2d').drawImage(cached, 0, 0, 52, 52);
  } else {
    // fallback: draw directly (shouldn't happen after init)
    const img=new Image(); img.src=src;
    cvs.getContext('2d').drawImage(img,0,0,52,52);
  }
  return cvs;
}

function spawnItem() {
  const cfg = getLevelConfig(level);
  const isWorm = Math.random() < cfg.wormChance;
  const x = FALL_LEFT + Math.random()*(FALL_W-52);

  const cvs = document.createElement('canvas');
  cvs.width=52; cvs.height=52;
  cvs.className='falling-item';
  cvs.style.left=x+'px';
  cvs.style.top='60px';

  const ctx = cvs.getContext('2d');
  if (isWorm && cachedMnh)  ctx.drawImage(cachedMnh,  0,0,52,52);
  if (!isWorm && cachedGrao) ctx.drawImage(cachedGrao, 0,0,52,52);

  container.appendChild(cvs);
  fallingItems.push({ el:cvs, x, y:60, type:isWorm?'worm':'coffee', points:isWorm?-20:10 });
}

// ─── GAME LOOP ─────────────────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (!gameRunning) return;
  const dt = lastTime ? Math.min(timestamp-lastTime,50) : 16;
  lastTime = timestamp;
  const cfg = getLevelConfig(level);

  if (keys.left)  playerX=Math.max(0,        playerX-cfg.playerSpeed);
  if (keys.right) playerX=Math.min(GAME_W-130,playerX+cfg.playerSpeed);
  playerCanvas.style.left = playerX+'px';

  spawnTimer+=dt;
  if (spawnTimer>=cfg.spawnInterval) {
    spawnTimer=0;
    spawnItem();
    if (level>=4 && Math.random()<0.45) spawnItem();
    if (level>=7 && Math.random()<0.35) spawnItem();
  }

  // Basket zone: horizontally span sprite, vertically top portion of basket
  const BL = playerX+10, BR = playerX+120;
  const BY = 640-52-162+80; // basket top for larger sprite

  for (let i=fallingItems.length-1;i>=0;i--) {
    const item=fallingItems[i];
    item.y += cfg.fallSpeed*(dt/16);
    item.el.style.top=item.y+'px';

    const cx=item.x+26, bot=item.y+44;

    if (bot>=BY && bot<=BY+30 && cx>=BL && cx<=BR) {
      score=Math.max(0,score+item.points);
      showPopup(item.points, item.x, BY-14);
      item.el.remove(); fallingItems.splice(i,1);
      updateHUD(); continue;
    }
    if (item.y>600) {
      if (item.type==='coffee') {
        lives--;
        updateHUD();
        showPopup('💔', item.x, 545, true);
        if (lives<=0) { item.el.remove(); fallingItems.splice(i,1); endGame(); return; }
      }
      item.el.remove(); fallingItems.splice(i,1);
    }
  }

  const newLv=Math.floor(score/100)+1;
  if (newLv>level) {
    level=newLv; showLevelBanner(level); updateHUD();
  }

  animId=requestAnimationFrame(gameLoop);
}

function showPopup(pts, x, y, isLife) {
  const el=document.createElement('div');
  el.className='score-popup';
  if (isLife) {
    el.textContent='💔'; el.style.color='#ef5350'; el.style.fontSize='1.6rem';
  } else {
    el.textContent=(pts>0?'+':'')+pts;
    el.style.color=pts>0?'#FFE082':'#ef9a9a';
  }
  el.style.left=Math.max(10,Math.min(420,x))+'px';
  el.style.top=y+'px';
  container.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

function showLevelBanner(lv) {
  bannerLv.textContent=lv;
  banner.style.display='block';
  setTimeout(()=>banner.style.display='none',1800);
}

function startGame() {
  score=0; lives=3; level=1;
  playerX=GAME_W/2-65;
  fallingItems.forEach(i=>i.el.remove());
  fallingItems=[]; spawnTimer=0; gameRunning=true; lastTime=0;
  startScr.style.display='none';
  overScr.style.display='none';
  updateHUD();
  if (animId) cancelAnimationFrame(animId);
  animId=requestAnimationFrame(gameLoop);
}

function endGame() {
  gameRunning=false;
  fallingItems.forEach(i=>i.el.remove()); fallingItems=[];
  document.getElementById('final-score-msg').textContent=score+' pontos!';
  document.getElementById('final-level-msg').textContent='Você chegou até a Fase '+level+'. Muito bem, Lucas!';
  overScr.style.display='flex';
}

document.getElementById('start-btn').onclick  = startGame;
document.getElementById('restart-btn').onclick = startGame;

// ─── INIT: load & process all sprites ─────────────────────────────────────
(async function init() {
  // Player
  await removeBlackBg(SRC_PER, playerCanvas, 30);

  // Grão cache
  const gCanvas = document.createElement('canvas');
  gCanvas.width=512; gCanvas.height=512;
  await removeBlackBg(SRC_GRAO, gCanvas, 30);
  cachedGrao = gCanvas;

  // Minhoca cache
  const mCanvas = document.createElement('canvas');
  mCanvas.width=512; mCanvas.height=512;
  await removeBlackBg(SRC_MNH, mCanvas, 30);
  cachedMnh = mCanvas;

  // Legend canvases
  const lg = document.getElementById('legend-grao');
  lg.getContext('2d').drawImage(cachedGrao,0,0,40,40);
  const lm = document.getElementById('legend-minha');
  lm.getContext('2d').drawImage(cachedMnh,0,0,40,40);
})();
</script>
